<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Define la codificación de caracteres -->
    <meta charset="UTF-8">

    <!-- Hace que la página sea responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Sumadora</title>
</head>
<body>

    <!-- Título principal de la página -->
    <h1>
        Mega Sumadora con API
    </h1>

    <!-- Formulario para ingresar los números -->
    <form>

        <!-- Etiqueta y campo para el número A -->
        <label for="A">A : </label>
        <input id="a" type="text">

        <br><br>

        <!-- Etiqueta y campo para el número B -->
        <label for="B">B : </label>
        <input id="b" type="text">

        <br><br>

        <!-- Botón para realizar la suma -->
        <button id="btn_sumar"> SUMAR </button>

    </form>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="programa.js"></script>

</body>
</html>
